<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f2">
  <meta name="description" content="Çarkı çevir, bir soru seç, sohbete başla.">
  <title>KonuYok</title>
</head>
<body>
<main class="app">
  <header class="header"><a class="brand" href="./" aria-label="KonuYok ana sayfa"><span aria-hidden="true">✳</span> KonuYok</a><span class="header-note">Bir çevir, konuşmaya başla.</span></header>
  <div id="loading" class="message" role="status">Çark hazırlanıyor…</div>
  <div id="error" class="message" hidden role="alert"><p>Sorular yüklenemedi.</p><button id="retry" class="secondary">Tekrar dene</button></div>
  <section id="game" class="game" aria-label="Sohbet çarkı" hidden>
    <div class="game-header"><div class="tabs" role="group" aria-label="Soru havuzu" id="tabs"></div></div>
    <div id="secret-banner" class="secret-banner" hidden><span>Gizli Kişisel açık</span><button id="exit-secret" class="text-button">Kişisel’e dön</button></div>
    <div class="wheel-area"><div class="pointer" aria-hidden="true"></div><div class="wheel-shell"><svg id="wheel" viewBox="-160 -160 320 320" role="img" aria-label="Kategori çarkı"></svg></div><div class="hub" aria-hidden="true">✳</div></div>
    <button id="spin" class="primary spin">Çarkı çevir <span aria-hidden="true">↻</span></button>
    <p id="notice" class="notice" role="status"></p>
    <article id="result" class="result" hidden><span id="category" class="category"></span><h1 id="question"></h1><div id="followups"></div><div class="actions"><button id="another" class="primary">Başka soru</button><button id="copy" class="secondary">Kopyala</button></div><p id="copy-status" class="copy-status" role="status"></p></article>
  </section>
  <div id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
